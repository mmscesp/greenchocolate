[build]
command = "npm run build"

[build.environment]
NETLIFY_NEXT_SKEW_PROTECTION = "true"
NEXT_TELEMETRY_DISABLED = "1"
# Sender display names are public branding strings and appear in site content.
# Exclude these keys from secret-value matching to avoid false-positive build failures.
SECRETS_SCAN_OMIT_KEYS = "BREVO_SENDER_NAME,RESEND_SENDER_NAME"
